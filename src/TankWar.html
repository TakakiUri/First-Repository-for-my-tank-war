/* ============================================================
   设计令牌 —— 一台 8-bit 街机柜：黑机箱、发光屏、游戏本体配色
   ============================================================ */
:root{
  --cab:#0c0f13;          /* 机箱深色 */
  --cab-2:#151a21;        /* 机箱高光面 */
  --edge:#2a323d;         /* 机箱棱线 */
  --screen:#000;          /* 屏幕底 */
  --phosphor:#f0d030;     /* 玩家坦克黄 —— 唯一强调色 */
  --phosphor-dim:#8a7a20;
  --ink:#c9d3e0;          /* 机箱上的说明文字 */
  --ink-dim:#6b7787;

  --pixel:"Press Start 2P", ui-monospace, monospace;
  --body:system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB",
         "Microsoft YaHei", sans-serif;
}

*{box-sizing:border-box}

html{height:100%}
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(120% 90% at 50% 0%, #171d26 0%, #0a0d11 55%, #05070a 100%),
    var(--cab);
  color:var(--ink);
  font-family:var(--body);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding-block:20px;
  padding-inline:16px;
  -webkit-font-smoothing:antialiased;
}

/* ---- 音乐资源加载页 ---- */
body.is-loading{overflow:hidden}
body.is-loading .cabinet,
body.is-loading .pad,
body.is-loading .mobile-settings{visibility:hidden}
.loading{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(90% 70% at 50% 42%, #1b222c 0%, #080b0f 68%, #030507 100%);
  opacity:1;
  visibility:visible;
  transition:opacity .22s ease, visibility .22s;
}
.loading[hidden]{display:none}
body:not(.is-loading) .loading{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.loading-panel{
  width:min(440px, 100%);
  padding:26px 24px 22px;
  border:1px solid var(--edge);
  border-radius:10px;
  background:linear-gradient(180deg, #161c24, #0b0f14);
  box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 34px rgba(240,208,48,.08);
}
.loading-kicker{
  font-family:var(--pixel);
  font-size:9px;
  letter-spacing:.12em;
  color:var(--phosphor-dim);
}
.loading-title{
  margin:12px 0 24px;
  font-family:var(--pixel);
  font-size:clamp(16px, 5vw, 24px);
  color:var(--phosphor);
  text-shadow:0 0 16px rgba(240,208,48,.35);
}
.loading-progress{
  height:12px;
  padding:2px;
  border:1px solid var(--edge);
  background:#05070a;
}
.loading-bar{
  width:0;
  height:100%;
  background:repeating-linear-gradient(
    90deg, var(--phosphor) 0 8px, #b89d16 8px 10px);
  box-shadow:0 0 12px rgba(240,208,48,.35);
  transition:width .16s linear;
}
.loading-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-top:12px;
  font-size:12px;
  color:var(--ink-dim);
}
.loading-percent{
  flex:none;
  font-family:var(--pixel);
  font-size:10px;
  color:var(--ink);
}
.loading-retry{
  display:block;
  margin:20px auto 0;
  padding:8px 14px;
  font-family:var(--pixel);
  font-size:9px;
  color:var(--phosphor);
  background:#1b2129;
  border:1px solid var(--phosphor-dim);
  border-radius:4px;
  cursor:pointer;
}
.loading-retry[hidden]{display:none}

/* ---- 机箱 ---- */
.cabinet{
  width:min(100%, calc((100svh - 210px) * 512 / 416), 900px);
  display:flex;
  flex-direction:column;
  gap:10px;
}

.marquee{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding-inline:4px;
}
.marquee h1{
  margin:0;
  font-family:var(--pixel);
  font-size:clamp(11px, 2.1vw, 15px);
  font-weight:400;
  letter-spacing:.06em;
  color:var(--phosphor);
  text-shadow:0 0 14px rgba(240,208,48,.35);
  text-wrap:balance;
}
.marquee .sub{
  font-size:12px;
  color:var(--ink-dim);
  letter-spacing:.08em;
}

/* ---- 屏幕 ---- */
.bezel{
  position:relative;
  padding:12px;
  border-radius:14px;
  background:linear-gradient(180deg, var(--cab-2), var(--cab));
  border:1px solid var(--edge);
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 22px 50px -18px rgba(0,0,0,.9),
    0 0 0 1px rgba(0,0,0,.6);
}

.screen{
  position:relative;
  aspect-ratio:512 / 416;
  background:var(--screen);
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 0 32px rgba(240,208,48,.07), 0 0 0 1px #000 inset;
}
.screen canvas{
  display:block;
  width:100%;
  height:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.mobile-settings{
  display:none;
  position:absolute;
  top:6px;
  right:8px;
  z-index:4;
  width:36px;
  height:36px;
  place-items:center;
  padding:0;
  color:var(--phosphor);
  background:transparent;
  border:0;
  box-shadow:none;
  font-size:24px;
  line-height:1;
  cursor:pointer;
  touch-action:manipulation;
}
.screen.in-game .mobile-settings{
  top:36%;
  right:calc(9.375% - 18px);
  transform:translateY(-50%);
}
.mobile-settings[hidden]{display:none}
.mobile-settings:focus-visible{outline:2px solid var(--phosphor); outline-offset:2px}

/* ---- 设置界面 ---- */
.settings-overlay{
  position:fixed;
  inset:0;
  z-index:60;
  display:grid;
  place-items:center;
  padding:16px;
  background:rgba(3,6,9,.82);
  backdrop-filter:blur(5px);
}
.settings-overlay[hidden],
.confirm-layer[hidden]{display:none}
.settings-panel{
  width:min(560px, 100%);
  max-height:calc(100svh - 32px);
  overflow:auto;
  padding:24px;
  border:1px solid var(--edge);
  border-radius:12px;
  background:
    linear-gradient(180deg, rgba(27,34,43,.98), rgba(10,14,19,.99));
  box-shadow:0 28px 90px rgba(0,0,0,.8), 0 0 34px rgba(240,208,48,.08);
}
.settings-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
}
.settings-kicker{
  display:block;
  margin-bottom:7px;
  font-family:var(--pixel);
  font-size:8px;
  letter-spacing:.14em;
  color:var(--phosphor-dim);
}
.settings-title{
  margin:0;
  font-family:var(--pixel);
  font-size:18px;
  font-weight:400;
  color:var(--phosphor);
}
.settings-hint{font-size:11px; color:var(--ink-dim)}
.settings-section{
  padding:16px;
  border:1px solid var(--edge);
  border-radius:8px;
  background:rgba(6,9,13,.55);
}
.settings-section + .settings-section{margin-top:12px}
.settings-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
  font-size:13px;
  color:var(--ink);
}
.settings-value{
  font-family:var(--pixel);
  font-size:9px;
  color:var(--phosphor);
}
.volume-control{
  display:grid;
  grid-template-columns:38px minmax(100px, 1fr) 38px;
  align-items:center;
  gap:10px;
}
.volume-control + .volume-control{margin-top:12px}
.volume-name{
  grid-column:1 / -1;
  font-size:12px;
  color:var(--ink-dim);
}
.step-button,
.settings-button,
.confirm-button,
.control-choice{
  color:var(--ink);
  background:#1b2129;
  border:1px solid var(--edge);
  border-radius:6px;
  cursor:pointer;
  touch-action:manipulation;
}
.step-button{
  width:38px;
  height:34px;
  font-family:var(--pixel);
  font-size:15px;
}
.step-button:hover,
.settings-button:hover,
.control-choice:hover{color:var(--phosphor); border-color:var(--phosphor-dim)}
.step-button:disabled{opacity:.35; cursor:default}
.volume-meter{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:5px;
  height:20px;
  padding:3px;
  border:1px solid var(--edge);
  background:#05070a;
}
.volume-meter span{
  display:block;
  border-radius:2px;
  background:#252e39;
  transition:background .12s, box-shadow .12s;
}
.volume-meter span.on{
  background:var(--phosphor);
  box-shadow:0 0 8px rgba(240,208,48,.25);
}
.control-choices{
  display:none;
  grid-template-columns:1fr 1fr;

'use strict';

/* ============================================================

/* ============================================================

let AC = null, muted = true, noiseBuf = null;
const SFX_GAIN = 2.6;
const VOLUME_STEPS = [0, 0.2, 0.4, 0.6, 0.8, 1];
let sfxVolumeLevel = 5, musicVolumeLevel = 5;

function ensureAudio(){
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { AC = null; }
  return AC;
}
function tone(freq, dur, type, vol, slideTo){
  if (muted || sfxVolumeLevel === 0) return;
  const ac = ensureAudio(); if (!ac) return;
  if (ac.state === 'suspended') ac.resume();
  vol = Math.min(0.30, vol * SFX_GAIN * VOLUME_STEPS[sfxVolumeLevel]);
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq){
  if (muted || sfxVolumeLevel === 0) return;
  const ac = ensureAudio(); if (!ac) return;
  if (ac.state === 'suspended') ac.resume();
  vol = Math.min(0.30, vol * SFX_GAIN * VOLUME_STEPS[sfxVolumeLevel]);
  if (!noiseBuf){
    const len = Math.floor(ac.sampleRate * 0.5);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq || 900, t);
  f.frequency.exponentialRampToValueAtTime(120, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/* ============================================================

const music = (() => {
  const sources = {
    title: [
      { url:'../assets/audio/TankWar_BGM.m4a?v=48m22', type:'audio/mp4' },

  const tracks = {};

  const prepared = { title:false, battle:false };

  for (const name of Object.keys(sources)){

  function ensureTrackGain(name){
    if (gainNodes[name]) return gainNodes[name];
    if (failedGains.has(name)) return null;
    const ac = ensureAudio();
    if (!ac) return null;
    try {
      const source = ac.createMediaElementSource(tracks[name]);
      const gain = ac.createGain();
      gain.gain.value = 0;
      source.connect(gain);
      gain.connect(ac.destination);
      gainNodes[name] = gain;
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      return gain;
    } catch (error){
      failedGains.add(name);
      console.warn('[music] Web Audio gain unavailable', name, error);
      return null;
    }
  }

  function setTrackVolume(name, value, allowCreate = true){
    const track = tracks[name];
    const gain = allowCreate ? ensureTrackGain(name) : gainNodes[name];
    if (gain){
      const ac = ensureAudio();
      if (ac) gain.gain.setTargetAtTime(value, ac.currentTime, 0.015);
      track.volume = 1;
    } else {
      try { track.volume = value; }
      catch (error) { console.warn('[music] element volume unavailable', name, error); }
    }
  }

  function safelyPlay(track){
    if (!track.paused && track.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return;
    if (playAttempts.has(track)) return;

    let attempt;
    try {
      attempt = track.play();
    } catch (error){
      console.warn('[music] playback failed', error);
      return;
    }
    if (!attempt || typeof attempt.then !== 'function') return;

    playAttempts.set(track, attempt);
    const clear = () => {
      if (playAttempts.get(track) === attempt) playAttempts.delete(track);
    };
    attempt.then(clear, error => {
      clear();
      if (error?.name !== 'AbortError') console.warn('[music] playback failed', error);
    });
  }

  function stopAll(){
    for (const [name, track] of Object.entries(tracks)){
      setTrackVolume(name, 0, false);
      track.pause();
    }
  }

  function activateScene(restart){
    const active = tracks[scene];
    const inactive = scene === 'title' ? tracks.battle : tracks.title;
    active.preload = 'auto';
    inactive.preload = 'metadata';
    if (restart){
      try { active.currentTime = 0; } catch (error) { console.warn('[music] seek failed', error); }
    }
    // GainNode keeps BGM volume adjustable on mobile browsers where changing
    // HTMLMediaElement.volume directly is ignored.
    setTrackVolume(scene, level[scene] * VOLUME_STEPS[musicVolumeLevel]);
    setTrackVolume(scene === 'title' ? 'battle' : 'title', 0);
    safelyPlay(active);
    if (!inactive.paused) inactive.pause();
  }

  function fadeTo(nextScene, restart){
    scene = nextScene;
    restartPending = restart;
    if (muted || paused){
      stopAll();
      return;
    }
    if (!prepared[scene]){
      preloadTrack(scene).catch(error => {
        console.warn('[music] background preload failed', scene, error);
      });
      return;
    }
    activateScene(restartPending);
    restartPending = false;
  }

  for (const [name, track] of Object.entries(tracks)){
    track.addEventListener('canplay', () => {
      if (shouldPlay(name)){
        setTrackVolume(name, level[name] * VOLUME_STEPS[musicVolumeLevel]);
        safelyPlay(track);
      }
    });
    track.addEventListener('ended', () => {
      if (!shouldPlay(name)) return;
      try { track.currentTime = 0; } catch (error) { console.warn('[music] loop failed', error); }
      safelyPlay(track);
    });
    track.addEventListener('error', () => {
      console.warn('[music] audio source failed', name, track.error);
    });
  }

  async function fetchAudio(candidate, report){
    const response = await fetch(candidate.url, { cache:'force-cache' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const total = Number(response.headers.get('content-length')) || 0;
    if (!response.body || typeof response.body.getReader !== 'function'){
      const bytes = await response.arrayBuffer();
      report(1);
      return new Blob([bytes], { type:candidate.type });
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.byteLength;
      if (total) report(Math.min(1, received / total));
    }
    report(1);
    return new Blob(chunks, { type:candidate.type });
  }

  function waitForPlayable(track, report = () => {}){
    return new Promise((resolve, reject) => {
      const ready = () => {
        cleanup();
        resolve();
      };
      const failed = () => {
        cleanup();
        reject(track.error || new Error('audio element failed'));
      };
      const update = () => {
        if (track.buffered.length && Number.isFinite(track.duration) && track.duration > 0){
          report(Math.min(1, track.buffered.end(track.buffered.length - 1) / track.duration));
        }
      };
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('music preload timed out'));
      }, 20000);
      const cleanup = () => {
        clearTimeout(timer);
        track.removeEventListener('canplaythrough', ready);
        track.removeEventListener('canplay', ready);
        track.removeEventListener('error', failed);
        track.removeEventListener('progress', update);
        track.removeEventListener('loadedmetadata', update);
      };

      if (track.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA){
        ready();
        return;
      }
      track.addEventListener('canplaythrough', ready);
      track.addEventListener('canplay', ready);
      track.addEventListener('error', failed);
      track.addEventListener('progress', update);
      track.addEventListener('loadedmetadata', update);
      track.load();
    });
  }

  async function prepareTrack(name, start, span, onProgress){
    const track = tracks[name];
    let lastError = null;
    for (const candidate of sources[name]){
      const report = fraction => {
        onProgress(start + span * Math.max(0, Math.min(1, fraction)), labels[name]);
      };
      try {
        report(0);
        let objectUrl;
        try {
          const blob = await fetchAudio(candidate, fraction => report(fraction * 0.88));
          objectUrl = URL.createObjectURL(blob);
          track.src = objectUrl;
          await waitForPlayable(track, fraction => report(0.88 + fraction * 0.12));
        } catch (fetchError){
          // file:// 和部分内置浏览器不允许 fetch，改用媒体元素直接预载。
          console.warn('[music] fetch preload failed, using media element', candidate.url, fetchError);
          track.src = candidate.url;
          await waitForPlayable(track, fraction => report(fraction));
        }
        if (objectUrls[name]) URL.revokeObjectURL(objectUrls[name]);
        objectUrls[name] = objectUrl;
        report(1);
        return;
      } catch (error){
        lastError = error;
        console.warn('[music] audio preload failed', candidate.url, error);
      }
    }
    throw lastError || new Error(`unable to load ${name} music`);
  }

  function preloadTrack(name, onProgress = () => {}){
    if (prepared[name]) return Promise.resolve();
    if (preparation[name]) return preparation[name];

    const promise = prepareTrack(name, 0, 1, onProgress).then(() => {
      prepared[name] = true;
      if (shouldPlay(name)){
        activateScene(restartPending);
        restartPending = false;
      }
    });
    preparation[name] = promise;
    promise.catch(() => {
      if (preparation[name] === promise) preparation[name] = null;
    });
    return promise;
  }

  function prepare(onProgress){
    return preloadTrack('title', onProgress).then(() => {
      onProgress(1, '初始界面音乐加载完成');
      // The title screen is usable now. Battle music continues loading while
      // the player reads the controls and starts a game.
      preloadTrack('battle').catch(error => {
        console.warn('[music] background preload failed', error);
      });
    });
  }

  return {
    prepare,
    init(){
      // A page already granted autoplay may start immediately. Otherwise the
      // first pointer/key gesture unlocks the intended scene.
      if (muted) return;
      fadeTo(scene, false);
    },
    unlock(){
      const ac = ensureAudio();
      if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
      fadeTo(scene, false);
    },
    play(nextScene, restart = false){ fadeTo(nextScene, restart); },
    pause(){
      paused = true;
      stopAll();
    },
    resume(){
      paused = false;
      fadeTo(scene, false);
    },
    mute(on){
      if (on) stopAll();
      else fadeTo(scene, false);
    },
    setVolume(levelIndex){
      musicVolumeLevel = Math.max(0, Math.min(VOLUME_STEPS.length - 1, levelIndex));
      if (prepared[scene]){
        setTrackVolume(
          scene,
          muted ? 0 : level[scene] * VOLUME_STEPS[musicVolumeLevel],
          false
        );
      }
    }
  };
})();

  const c = document.createElement('canvas');
  c.width = w; c.height = h;

}

function tankSprite(kind, dir, pLevel){
  return sprite(TANK, TANK, g => {
    g.save();
    g.translate(16, 16);
    g.rotate({ up:0, right:Math.PI/2, down:Math.PI, left:-Math.PI/2 }[dir]);
    g.translate(-16, -16);
    const c = SKIN[kind] || SKIN.normal;

    g.fillStyle = c.dark;                       // 履带
    g.fillRect(2, 4, 7, 24);
    g.fillRect(23, 4, 7, 24);
    g.fillStyle = c.light;
    for (let i = 0; i < 5; i++){
      g.fillRect(3, 6 + i * 5, 5, 2);
      g.fillRect(24, 6 + i * 5, 5, 2);
    }

    g.fillStyle = c.mid;   g.fillRect(9, 8, 14, 20);   // 车身
    g.fillStyle = c.light; g.fillRect(9, 8, 14, 3);
    g.fillStyle = c.dark;  g.fillRect(9, 25, 14, 3);

    g.fillStyle = c.light;                              // 炮塔
    g.beginPath(); g.arc(16, 16, 6, 0, 7); g.fill();
    g.fillStyle = c.dark;
    g.beginPath(); g.arc(16, 16, 3.2, 0, 7); g.fill();

    g.fillStyle = c.dark;  g.fillRect(14, 1, 4, 15);    // 炮管
    g.fillStyle = c.light; g.fillRect(15, 1, 2, 15);
    if (pLevel >= 2){                                   // 三星：三管
      g.fillStyle = c.dark;
      g.fillRect(10, 4, 3, 11); g.fillRect(19, 4, 3, 11);
      g.fillStyle = c.light;
      g.fillRect(11, 4, 1, 11); g.fillRect(20, 4, 1, 11);
    }
    g.restore();
  });
}

function buildGrid(level){
  const g = new Uint8Array(ROWS * COLS);
  const lv = LEVELS[level % LEVELS.length];
  const map = { B:BRICK, S:STEEL, W:WATER, T:TREE, I:ICE, E:BASE };
  for (let r = 0; r < 13; r++){
    const row = lv[r];
    for (let c = 0; c < 13; c++){
      const t = map[row[c]];
      if (!t) continue;
      for (let dr = 0; dr < 2; dr++)
        for (let dc = 0; dc < 2; dc++)
          g[(r * 2 + dr) * COLS + (c * 2 + dc)] = t;
    }
  }
  return g;
}

/* ============================================================
   碰撞
   ============================================================ */
function tilesBlockTank(x, y){
  if (x < 0 || y < 0 || x + TANK > FIELD || y + TANK > FIELD) return true;
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + TANK - 1) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + TANK - 1) / TILE);
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++){
      const t = grid[r * COLS + c];
      if (t === BRICK || t === STEEL || t === WATER || t === BASE) return true;
    }
  return false;
}

function canPlace(x, y, self){
  if (x < 0 || y < 0 || x + TANK > FIELD || y + TANK > FIELD) return false;
  if (tilesBlockTank(x, y)) return false;
  for (let i = 0; i < tanks.length; i++){
    const o = tanks[i];
    if (o === self || !o.alive) continue;
    if (x < o.x + TANK && x + TANK > o.x && y < o.y + TANK && y + TANK > o.y) return false;
  }
  return true;
}

function onIce(t){
  const c = Math.floor((t.x + TANK / 2) / TILE);
  const r = Math.floor((t.y + TANK / 2) / TILE);
  if (r < 0 || c < 0 || r >= ROWS || c >= COLS) return false;
  return grid[r * COLS + c] === ICE;
}

function snapAxis(t, ax){
  const cur = t[ax];
  const near = Math.round(cur / TILE) * TILE;
  if (near === cur) return;
  t[ax] = near;
  if (!canPlace(t.x, t.y, t)) {
    t[ax] = near > cur ? Math.floor(cur / TILE) * TILE : Math.ceil(cur / TILE) * TILE;
    if (!canPlace(t.x, t.y, t)) t[ax] = cur;
  }
}

function setDir(t, dir){
  if (t.dir === dir) return;
  if (DIRS[dir].x !== 0) snapAxis(t, 'y');
  else snapAxis(t, 'x');
  t.dir = dir;
}

function moveTank(t, dt, mul){
  const d = DIRS[t.dir];
  const dist = t.speed * (mul || 1) * dt;
  const nx = t.x + d.x * dist, ny = t.y + d.y * dist;
  if (canPlace(nx, ny, t)){ t.x = nx; t.y = ny; return true; }
  return false;
}

function enemyType(level){
  const r = Math.random();
  if (level === 0) return r < 0.72 ? 'normal' : 'fast';
  if (level === 1) return r < 0.48 ? 'normal' : r < 0.76 ? 'fast' : 'power';
  if (level === 2) return r < 0.32 ? 'normal' : r < 0.54 ? 'fast' : r < 0.80 ? 'power' : 'armor';
  if (level === 3) return r < 0.27 ? 'normal' : r < 0.48 ? 'fast' : r < 0.74 ? 'power' : 'armor';
  return r < 0.22 ? 'normal' : r < 0.41 ? 'fast' : r < 0.67 ? 'power' : 'armor';
}

function buildQueue(level){
  const q = [];
  const n = ENEMY_TOTAL[level] || ENEMY_TOTAL[ENEMY_TOTAL.length - 1];
  for (let i = 0; i < n; i++)
    q.push({ type: enemyType(level), carrier: (i === 3 || i === 10 || i === 17) });
  return q;
}

function spawnEnemy(){
  if (!G.queue.length || aliveEnemies() >= G.maxField) return;
  for (let k = 0; k < 3; k++){
    const pos = SPAWN_ENEMY[(G.spawnIdx + k) % 3];
    if (!canPlace(pos.x, pos.y, null)) continue;
    const spec = G.queue.shift();
    const def = ENEMY_TYPES[spec.type];
    tanks.push({
      kind: spec.type, x: pos.x, y: pos.y, dir:'down', speed: def.speed,
      hp: def.hp, alive:true, spawn:1.0, shield:0, cool:0,
      bulletsAlive:0, slide:0, carrier: spec.carrier,
      think: 0.4 + Math.random(), fireTimer: 1.2, stuck:0, hitFlash:0,
      shotLine:null, lineShots:0
    });
    G.spawnIdx = (G.spawnIdx + k + 1) % 3;
    return;
  }
}

function removeTank(t){
  t.alive = false;
  const i = tanks.indexOf(t);
  if (i >= 0) tanks.splice(i, 1);
}

/* ============================================================
   子弹
   ============================================================ */
function firingLine(t, dir){
  const d = DIRS[dir || t.dir];
  if (d.x !== 0) return 'h:' + Math.round((t.y + TANK / 2) / TILE);
  return 'v:' + Math.round((t.x + TANK / 2) / TILE);
}

function lineShotBlocked(t){
  return t.kind !== 'player' &&
    t.lineShots >= MAX_SHOTS_PER_LINE &&
    t.shotLine === firingLine(t);
}

function recordLineShot(t){
  if (t.kind === 'player') return;
  const line = firingLine(t);
  if (line === t.shotLine) t.lineShots++;
  else { t.shotLine = line; t.lineShots = 1; }
  if (t.lineShots >= MAX_SHOTS_PER_LINE)
    t.think = Math.min(t.think, 0.2);
}

function fire(t){
  if (t.cool > 0 || t.spawn > 0) return;
  if (lineShotBlocked(t)) return;
  const maxB = t.kind === 'player' ? (G.pLevel >= 2 ? 2 : 1) : 1;
  if (t.bulletsAlive >= maxB) return;

  const d = DIRS[t.dir];
  t.cool = t.kind === 'player' ? 0.16 : 0.32;
  bullets.push({
    x: t.x + TANK / 2 + d.x * (TANK / 2) - BULLET / 2,
    y: t.y + TANK / 2 + d.y * (TANK / 2) - BULLET / 2,
    dir: t.dir,
    speed: t.kind === 'player' ? (G.pLevel >= 1 ? 660 : 340) : ENEMY_TYPES[t.kind].bullet,
    owner: t.kind === 'player' ? 'player' : 'enemy',
    power: (t.kind === 'player' && G.pLevel >= 3) ? 2 : 1,
    from: t
  });
  t.bulletsAlive++;
  recordLineShot(t);
  if (t.kind === 'player') sfx.shoot();
  else if (Math.random() < 0.45) sfx.shoot();
}

function killBullet(i){
  const b = bullets[i];
  if (b.from) b.from.bulletsAlive = Math.max(0, b.from.bulletsAlive - 1);
  bullets.splice(i, 1);
}

function destroyBase(){
  if (!G.baseAlive) return;
  G.baseAlive = false;
  for (const i of BASE_WALL) grid[i] = EMPTY;
  explode(BASE_CX, BASE_CY, 'big');
  explode(BASE_X + 6, BASE_Y + 22, 'big');
  sfx.boom();
  gameOver();
}

function bulletHitTiles(b){
  const c0 = Math.floor(b.x / TILE), c1 = Math.floor((b.x + BULLET - 1) / TILE);
  const r0 = Math.floor(b.y / TILE), r1 = Math.floor((b.y + BULLET - 1) / TILE);
  let hitBrick = false, hitSteel = false, hitBase = false;
  for (let r = r0; r <= r1; r++){
    if (r < 0 || r >= ROWS) continue;
    for (let c = c0; c <= c1; c++){
      if (c < 0 || c >= COLS) continue;
      const i = r * COLS + c, t = grid[i];
      if (t === BRICK){ hitBrick = true; grid[i] = EMPTY; }
      else if (t === STEEL){ hitSteel = true; if (b.power >= 2) grid[i] = EMPTY; }
      else if (t === BASE) hitBase = true;
    }
  }
  if (hitBase){ destroyBase(); return true; }
  if (hitBrick){ fx(b.x + BULLET / 2, b.y + BULLET / 2, 'small'); sfx.brick(); return true; }
  if (hitSteel){ fx(b.x + BULLET / 2, b.y + BULLET / 2, 'small'); sfx.clang(); return true; }
  return false;
}

function bulletHitTanks(b){
  for (const t of tanks){
    if (!t.alive || t === b.from || t.spawn > 0) continue;
    if (b.owner === 'player' ? t.kind === 'player' : t.kind !== 'player') continue;
    if (b.x < t.x + TANK && b.x + BULLET > t.x && b.y < t.y + TANK && b.y + BULLET > t.y){
      if (t.kind === 'player'){
        if (t.shield > 0){ fx(b.x + 4, b.y + 4, 'small'); sfx.clang(); }
        else killPlayer();
      } else {
        t.hp--;
        if (t.hp <= 0) killEnemy(t, true);
        else { t.hitFlash = 0.22; sfx.clang(); fx(b.x + 4, b.y + 4, 'small'); }
      }
      return true;
    }
  }
  return false;
}

function killEnemy(t, byPlayer){
  explode(t.x + 16, t.y + 16, 'big');
  sfx.boom();
  removeTank(t);
  if (byPlayer) G.score += ENEMY_TYPES[t.kind].score;
  if (t.carrier) dropPower();
}

function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    const d = DIRS[b.dir];
    const total = b.speed * dt;
    const steps = Math.max(1, Math.ceil(total / 4));
    const step = total / steps;
    let dead = false;

    for (let s = 0; s < steps && !dead; s++){
      b.x += d.x * step;
      b.y += d.y * step;
      if (b.x < -BULLET || b.y < -BULLET || b.x > FIELD || b.y > FIELD){
        fx(Math.max(0, Math.min(FIELD, b.x + 4)), Math.max(0, Math.min(FIELD, b.y + 4)), 'small');
        dead = true;
      } else if (bulletHitTiles(b) || bulletHitTanks(b)){
        dead = true;
      }
    }
    if (dead) killBullet(i);
  }

  // 子弹对撞
  for (let i = bullets.length - 1; i >= 0; i--){
    for (let j = i - 1; j >= 0; j--){
      const a = bullets[i], b = bullets[j];
      if (!a || !b || a.owner === b.owner) continue;
      if (a.x < b.x + BULLET && a.x + BULLET > b.x && a.y < b.y + BULLET && a.y + BULLET > b.y){
        fx((a.x + b.x) / 2 + 4, (a.y + b.y) / 2 + 4, 'small');
        sfx.clang();
        killBullet(i); killBullet(j);
        break;
      }
    }
  }
}

/* ============================================================
   敌人 AI
   ============================================================ */
function canStep(t, dir){
  const d = DIRS[dir];
  return canPlace(t.x + d.x * 5, t.y + d.y * 5, t);
}

function chooseDir(t, force){
  const opts = [];
  for (const dir of DIR_NAMES){
    if (!canStep(t, dir)) continue;
    let w = 1;
    if (t.lineShots >= MAX_SHOTS_PER_LINE && firingLine(t, dir) === t.shotLine)
      w *= 0.15;
    if (dir === 'down') w += 1.4;
    if (dir === t.dir) w += force ? -1.6 : 0.7;

    const targets = [{ x: BASE_CX, y: BASE_CY, w: 1.6 }];
    if (player && player.alive) targets.push({ x: player.x + 16, y: player.y + 16, w: 2.4 });
    for (const tg of targets){
      const dx = tg.x - (t.x + 16), dy = tg.y - (t.y + 16);
      if (Math.abs(dx) > Math.abs(dy)){
        if (dir === 'left'  && dx < 0) w += tg.w;
        if (dir === 'right' && dx > 0) w += tg.w;
      } else {
        if (dir === 'up'   && dy < 0) w += tg.w;
        if (dir === 'down' && dy > 0) w += tg.w;
      }
    }
    opts.push({ dir, w: Math.max(0.1, w) });
  }

  if (!opts.length){
    t.dir = DIR_NAMES[(Math.random() * 4) | 0];
    t.think = 0.5;
    return;
  }
  let sum = 0;
  for (const o of opts) sum += o.w;
  let r = Math.random() * sum;
  let pick = opts[0].dir;
  for (const o of opts){ r -= o.w; if (r <= 0){ pick = o.dir; break; } }
  setDir(t, pick);
  t.think = 0.45 + Math.random() * 1.3;
}

function aimedAtTarget(t){
  const d = DIRS[t.dir];
  const cx = t.x + 16, cy = t.y + 16;
  const list = [{ x: BASE_CX, y: BASE_CY }];
  if (player && player.alive) list.push({ x: player.x + 16, y: player.y + 16 });
  for (const tg of list){
    if (d.x !== 0 && Math.abs(cy - tg.y) < 22 && Math.sign(tg.x - cx) === d.x) return true;
    if (d.y !== 0 && Math.abs(cx - tg.x) < 22 && Math.sign(tg.y - cy) === d.y) return true;
  }
  return false;
}

function updateEnemy(t, dt){
  if (t.spawn > 0){ t.spawn -= dt; return; }
  if (t.hitFlash > 0) t.hitFlash -= dt;
  if (G.freeze > 0) return;

  t.cool = Math.max(0, t.cool - dt);
  t.think -= dt;
  if (t.think <= 0) chooseDir(t, false);

  if (!moveTank(t, dt, 1)){
    t.stuck += dt;
    if (t.stuck > 0.06){ chooseDir(t, true); t.stuck = 0; }
  } else t.stuck = 0;

  t.fireTimer -= dt;
  if (t.fireTimer <= 0){
    fire(t);
    t.fireTimer = 0.7 + Math.random() * 1.5;
  } else if (aimedAtTarget(t) && Math.random() < 0.07){
    fire(t);
  }
}

/* ============================================================
   道具
   ============================================================ */
function dropPower(){
  let type = POWERS[(Math.random() * POWERS.length) | 0];
  if (G.pLevel >= 3 && type === 'star') type = 'grenade';
  const x = 32 + Math.floor(Math.random() * (FIELD - 96) / TILE) * TILE;
  const y = 32 + Math.floor(Math.random() * (FIELD - 160) / TILE) * TILE;
  powerups.push({ type, x, y, life: 22 });
  sfx.drop();
}

function takePower(p){
  sfx.power();
  G.score += 500;
  switch (p.type){
    case 'star':   G.pLevel = Math.min(3, G.pLevel + 1); break;
    case 'helmet': if (player) player.shield = 12; break;
    case 'clock':  G.freeze = 8; break;
    case 'shovel':
      G.shovel = 15;
      for (const i of BASE_WALL) if (grid[i] !== BASE) grid[i] = STEEL;
      break;
    case 'grenade':
      for (const t of tanks.filter(x => x.kind !== 'player')){
        G.score += ENEMY_TYPES[t.kind].score;
        killEnemy(t, false);
      }
      break;
    case 'tank': G.lives++; break;
  }
}

function updatePowerups(dt){
  for (let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.life -= dt;
    if (p.life <= 0){ powerups.splice(i, 1); continue; }
    if (player && player.alive && player.spawn <= 0 &&
        player.x < p.x + 28 && player.x + TANK > p.x &&
        player.y < p.y + 28 && player.y + TANK > p.y){
      takePower(p);
      powerups.splice(i, 1);
    }
  }
}

/* ============================================================
   特效
   ============================================================ */
function fx(x, y, size){
  effects.push({ x, y, t:0, dur: size === 'big' ? 0.42 : 0.16, big: size === 'big' });
}
const explode = (x, y, size) => fx(x, y, size);

function updateEffects(dt){
  for (let i = effects.length - 1; i >= 0; i--){
    effects[i].t += dt;
    if (effects[i].t >= effects[i].dur) effects.splice(i, 1);
  }
}

/* ============================================================
   流程
   ============================================================ */
function startLevel(){
  grid = buildGrid(G.level);
  tanks = []; bullets = []; effects = []; powerups = [];
  player = null; G.playerSpawnIdx = 0;
  G.baseAlive = true; G.freeze = 0; G.shovel = 0; G.respawnT = 0;
  G.queue = buildQueue(G.level);
  G.maxField = MAX_ON_FIELD[G.level] || MAX_ON_FIELD[MAX_ON_FIELD.length - 1];
  G.spawnTimer = 1.4; G.spawnIdx = 0; G.pLevel = 0; G.timer = 0;
  G.state = 'play';
  spawnPlayer();
  snap();
}

function startGame(){
  G.level = 0; G.score = 0; G.lives = 3;
  G.curtain = { t:1, phase:'open', cb:null };
  startLevel();
  music.play('battle', true);
  sfx.start();
}

function stageClear(){
  G.state = 'clear';
  G.timer = 2.6;
  sfx.clear();
  snap();
}

function closeCurtain(cb){ G.curtain = { t:0, phase:'close', cb }; }

function gameOver(){
  if (G.state === 'over' || G.state === 'win') return;
  G.state = 'over';
  G.timer = 0;
  player = null;
  G.hi = Math.max(G.hi, G.score);
  sfx.over();
  snap();
}

function victory(){
  G.state = 'win';
  player = null;
  G.hi = Math.max(G.hi, G.score);
  sfx.clear();
  snap();
}

function killPlayer(){
  if (!player || player.shield > 0) return;
  explode(player.x + 16, player.y + 16, 'big');
  sfx.die();
  removeTank(player);
  player = null;
  G.lives--;
  if (G.lives <= 0){ G.lives = 0; gameOver(); }
  else G.respawnT = 1.4;
}

function updateCurtain(dt){
  const c = G.curtain;
  if (!c) return;
  if (c.phase === 'close'){
    c.t += dt * 2.4;
    if (c.t >= 1){
      c.t = 1; c.phase = 'open';
      const cb = c.cb; c.cb = null;
      if (cb) cb();
    }
  } else {
    c.t -= dt * 2.4;
    if (c.t <= 0){ c.t = 0; G.curtain = null; }
  }
}

/* ============================================================
   输入
   ============================================================ */
const KEYDIR = {
  arrowup:'up', w:'up', arrowdown:'down', s:'down',
  arrowleft:'left', a:'left', arrowright:'right', d:'right'
};
const dirStack = [];
const settingsOverlay = document.getElementById('settingsOverlay');
const exitConfirm = document.getElementById('exitConfirm');
const mobileSettingsBtn = document.getElementById('mobileSettings');
const screenSurface = document.querySelector('.screen');
const settingsKicker = document.getElementById('settingsKicker');
const settingsHint = settingsOverlay.querySelector('.settings-hint');
const settingsResumeButton = settingsOverlay.querySelector('[data-settings-action="resume"]');
const settingsExitButton = settingsOverlay.querySelector('[data-settings-action="exit"]');
const pad = document.getElementById('pad');
const joystick = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystickKnob');
const mobileLayout = window.matchMedia('(pointer: coarse), (max-width: 720px)');
let joystickDir = null;
let joystickPointer = null;

function pushDir(dir){
  const i = dirStack.indexOf(dir);
  if (i >= 0) dirStack.splice(i, 1);
  dirStack.push(dir);
}
function popDir(dir){
  const i = dirStack.indexOf(dir);
  if (i >= 0) dirStack.splice(i, 1);
}

function readSetting(key, fallback){
  try {
    const stored = localStorage.getItem(key);
    if (stored === null) return fallback;
    const value = Number(stored);
    return Number.isInteger(value) ? value : fallback;
  } catch (error){
    return fallback;
  }
}

function writeSetting(key, value){
  try { localStorage.setItem(key, String(value)); }
  catch (error) { /* 隐私模式下忽略持久化失败。 */ }
}

function readControlStyle(){
  try {
    const value = localStorage.getItem('tankwar.controlStyle');
    return value === 'dpad' ? 'dpad' : 'joystick';
  } catch (error){
    return 'joystick';
  }
}

sfxVolumeLevel = Math.max(0, Math.min(5, readSetting('tankwar.sfxVolume', 5)));
musicVolumeLevel = Math.max(0, Math.min(5, readSetting('tankwar.musicVolume', 5)));
music.setVolume(musicVolumeLevel);

function syncVolumeControl(kind){
  const control = settingsOverlay.querySelector(`[data-volume="${kind}"]`);
  if (!control) return;
  const level = kind === 'sfx' ? sfxVolumeLevel : musicVolumeLevel;
  const meter = control.querySelector('.volume-meter');
  meter.setAttribute('aria-valuenow', String(level));
  meter.querySelectorAll('span').forEach((segment, index) => {
    segment.classList.toggle('on', index < level);
  });
  const buttons = control.querySelectorAll('[data-volume-step]');
  buttons[0].disabled = level === 0;
  buttons[1].disabled = level === 5;
}

function setVolumeLevel(kind, level){
  const next = Math.max(0, Math.min(5, level));
  if (kind === 'sfx'){
    sfxVolumeLevel = next;
    writeSetting('tankwar.sfxVolume', next);
  } else {
    musicVolumeLevel = next;
    music.setVolume(next);
    writeSetting('tankwar.musicVolume', next);
  }
  syncVolumeControl(kind);
}

function setJoystickDirection(dir){
  if (joystickDir === dir) return;
  if (joystickDir) popDir(joystickDir);
  joystickDir = dir;
  if (dir) pushDir(dir);
}

function resetJoystick(){
  joystickPointer = null;
  joystick.style.setProperty('--jx', '0px');
  joystick.style.setProperty('--jy', '0px');
  setJoystickDirection(null);
}

function clearMovement(){
  dirStack.length = 0;
  fireHeld = false;
  resetJoystick();
  pad.querySelectorAll('[data-held]').forEach(button => button.removeAttribute('data-held'));
}

function setControlStyle(style, persist = true){
  const next = style === 'dpad' ? 'dpad' : 'joystick';
  pad.dataset.control = next;
  settingsOverlay.querySelectorAll('[data-control-style]').forEach(button => {
    const selected = button.dataset.controlStyle === next;
    button.classList.toggle('selected', selected);
    button.setAttribute('aria-pressed', String(selected));
  });
  clearMovement();
  if (persist) writeSetting('tankwar.controlStyle', next);
}

function openSettings(){
  const fromTitle = G.state === 'title';
  if (!fromTitle && G.state !== 'play') return;
  if (!fromTitle){
    G.state = 'paused';
    clearMovement();
    music.pause();
  }
  exitConfirm.hidden = true;
  settingsOverlay.hidden = false;
  document.body.classList.add('settings-open');
  settingsKicker.textContent = fromTitle ? 'GAME SETTINGS' : 'GAME PAUSED';
  settingsResumeButton.textContent = fromTitle ? '关闭设置' : '继续游戏';
  settingsExitButton.hidden = fromTitle;
  settingsHint.textContent = fromTitle ? '调整完成后关闭设置' : '按 P 或 Esc 继续游戏';
  syncVolumeControl('sfx');
  syncVolumeControl('music');
  setControlStyle(pad.dataset.control, false);
}

function resumeGame(){
  exitConfirm.hidden = true;
  settingsOverlay.hidden = true;
  document.body.classList.remove('settings-open');
  if (G.state === 'paused'){
    G.state = 'play';
    music.resume();
  }
}

function returnToTitle(){
  clearMovement();
  settingsOverlay.hidden = true;
  document.body.classList.remove('settings-open');
  exitConfirm.hidden = true;
  G.state = 'title';
  G.timer = 0;
  G.curtain = null;
  player = null;
  // Keep the paused music state while changing scenes so the battle track
  // cannot briefly resume before the title track takes over.
  music.pause();
  music.play('title', true);
  music.resume();
}

function toggleSettings(){
  if (!settingsOverlay.hidden){
    resumeGame();
    return;
  }
  if (G.state === 'play') openSettings();
  else if (G.state === 'title') openSettings();
  else if (G.state === 'paused') resumeGame();
}

const muteBtn = document.getElementById('mute');
function toggleMute(){
  muted = !muted;
  ensureAudio();
  music.mute(muted);
  muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
  muteBtn.setAttribute('aria-label', muted ? '开启声音' : '关闭声音');
  muteBtn.setAttribute('aria-pressed', String(!muted));
}
muteBtn.addEventListener('click', toggleMute);
document.addEventListener('pointerdown', () => music.unlock(), { capture:true, passive:true });
mobileSettingsBtn.addEventListener('click', openSettings);

settingsOverlay.addEventListener('click', event => {
  const stepButton = event.target.closest('[data-volume-step]');
  if (stepButton){
    const kind = stepButton.closest('[data-volume]').dataset.volume;
    const current = kind === 'sfx' ? sfxVolumeLevel : musicVolumeLevel;
    setVolumeLevel(kind, current + Number(stepButton.dataset.volumeStep));
    if (kind === 'sfx') tone(880, 0.06, 'square', 0.045);
    return;
  }

  const controlButton = event.target.closest('[data-control-style]');
  if (controlButton){
    setControlStyle(controlButton.dataset.controlStyle);
    return;
  }

  const actionButton = event.target.closest('[data-settings-action]');
  if (actionButton){
    if (actionButton.dataset.settingsAction === 'resume') resumeGame();
    else exitConfirm.hidden = false;
    return;
  }

  const exitButton = event.target.closest('[data-exit-action]');
  if (exitButton){
    if (exitButton.dataset.exitAction === 'confirm') returnToTitle();
    else exitConfirm.hidden = true;
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'play') openSettings();
});

function confirmKey(){
  ensureAudio();
  music.unlock();
  if (G.state === 'title') startGame();
  else if (G.state === 'over' || G.state === 'win'){
    G.state = 'title'; G.timer = 0;
    music.play('title', true);
  }
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYDIR[k] || k === ' ' || k === 'j' || k === 'p' || k === 'enter' ||
      k === 'm' || k === 'escape')
    e.preventDefault();
  if (e.repeat) return;
  ensureAudio();
  music.unlock();

  if (k === 'm'){ toggleMute(); return; }
  if (k === 'p'){ toggleSettings(); return; }
  if (k === 'escape' && !exitConfirm.hidden){
    exitConfirm.hidden = true;
    return;
  }
  if (k === 'escape' && !settingsOverlay.hidden){ resumeGame(); return; }
  if (!settingsOverlay.hidden) return;
  if (G.state === 'paused') return;
  if (k === 'enter' || k === ' '){
    if (G.state === 'title' || G.state === 'over' || G.state === 'win'){ confirmKey(); return; }
  }
  if (KEYDIR[k]) pushDir(KEYDIR[k]);
  if (k === ' ' || k === 'j') fireHeld = true;
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (KEYDIR[k]) popDir(KEYDIR[k]);
  if (k === ' ' || k === 'j') fireHeld = false;
});

window.addEventListener('blur', () => {
  clearMovement();
  if (G.state === 'play') openSettings();
});

/* 触屏手柄 */
pad.addEventListener('contextmenu', e => e.preventDefault());
pad.addEventListener('selectstart', e => e.preventDefault());
pad.addEventListener('dragstart', e => e.preventDefault());

for (const btn of pad.querySelectorAll('button')){
  const dir = btn.dataset.dir;
  const isFire = btn.hasAttribute('data-fire');
  const down = e => {
    e.preventDefault();
    ensureAudio();
    music.unlock();
    if (G.state !== 'play' && !isFire) return;
    btn.setAttribute('data-held', '');
    if (isFire){
      fireHeld = true;
      if (G.state === 'title' || G.state === 'over' || G.state === 'win') confirmKey();
    } else if (dir){
      pushDir(dir);
    }
  };
  const up = e => {
    e.preventDefault();
    btn.removeAttribute('data-held');
    if (isFire) fireHeld = false;
    else if (dir) popDir(dir);
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

joystick.addEventListener('pointerdown', event => {
  if (G.state !== 'play') return;
  event.preventDefault();
  ensureAudio();
  music.unlock();
  joystickPointer = event.pointerId;
  joystick.setPointerCapture(event.pointerId);
  updateJoystick(event);
});

joystick.addEventListener('pointermove', event => {
  if (event.pointerId !== joystickPointer) return;
  event.preventDefault();
  updateJoystick(event);
});

function finishJoystick(event){
  if (event.pointerId !== joystickPointer) return;
  resetJoystick();
}

function updateJoystick(event){
  const rect = joystick.getBoundingClientRect();
  const dx = event.clientX - (rect.left + rect.width / 2);
  const dy = event.clientY - (rect.top + rect.height / 2);
  const distance = Math.hypot(dx, dy);
  const limit = Math.max(24, rect.width * 0.26);
  const scale = distance > limit ? limit / distance : 1;
  joystick.style.setProperty('--jx', `${dx * scale}px`);
  joystick.style.setProperty('--jy', `${dy * scale}px`);

  if (distance < 10){
    setJoystickDirection(null);
  } else if (Math.abs(dx) > Math.abs(dy)){
    setJoystickDirection(dx < 0 ? 'left' : 'right');
  } else {
    setJoystickDirection(dy < 0 ? 'up' : 'down');
  }
}

joystick.addEventListener('pointerup', finishJoystick);
joystick.addEventListener('pointercancel', finishJoystick);
joystick.addEventListener('lostpointercapture', finishJoystick);

setControlStyle(readControlStyle(), false);
syncVolumeControl('sfx');
syncVolumeControl('music');

/* ============================================================
   更新
   ============================================================ */
function updatePlayer(dt){
  if (!player) return;
  const t = player;
  if (t.spawn > 0){ t.spawn -= dt; return; }
  if (t.shield > 0) t.shield -= dt;
  t.cool = Math.max(0, t.cool - dt);

  const dir = dirStack.length ? dirStack[dirStack.length - 1] : null;
  if (dir){
    setDir(t, dir);
    moveTank(t, dt, 1);
    t.slide = onIce(t) ? 0.26 : 0;
  } else if (t.slide > 0 && onIce(t)){
    t.slide -= dt;
    moveTank(t, dt, 0.7);
  } else t.slide = 0;

  if (fireHeld) fire(t);
}

function update(dt){
  G.blink += dt;

  if (G.state === 'clear'){
    updateEffects(dt);
    G.timer -= dt;
    if (G.timer <= 0 && !G.curtain){
      closeCurtain(() => {
        if (G.level + 1 >= LEVELS.length) victory();
        else { G.level++; startLevel(); }
      });
    }
  } else if (G.state === 'play'){
    updatePlayer(dt);

    if (G.respawnT > 0){
      G.respawnT -= dt;
      if (G.respawnT <= 0 && G.baseAlive && G.lives > 0) spawnPlayer();
    }

    for (const t of tanks.slice())
      if (t.kind !== 'player') updateEnemy(t, dt);

    updateBullets(dt);
    updatePowerups(dt);
    updateEffects(dt);

    if (G.freeze > 0) G.freeze -= dt;
    if (G.shovel > 0){
      G.shovel -= dt;
      if (G.shovel <= 0)
        for (const i of BASE_WALL) if (grid[i] !== BASE) grid[i] = BRICK;
    }

    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0 && G.queue.length && aliveEnemies() < G.maxField){
      spawnEnemy();
      G.spawnTimer = 2.2;
    }

    if (G.state === 'play' && !G.queue.length && aliveEnemies() === 0) stageClear();
  } else {
    updateEffects(dt);
  }

  updateCurtain(dt);
}

/* ============================================================
   渲染
   ============================================================ */
function drawField(){
  const waterFrame = IMG[WATER][(performance.now() / 480 | 0) % 2];
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const t = grid[r * COLS + c];
      if (t === EMPTY || t === TREE || t === BASE) continue;
      ctx.drawImage(t === WATER ? waterFrame : IMG[t], c * TILE, r * TILE);
    }
  }
  ctx.drawImage(G.baseAlive ? IMG[BASE] : IMG.brokenBase, BASE_X, BASE_Y);
}

function drawTrees(){
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r * COLS + c] === TREE) ctx.drawImage(IMG[TREE], c * TILE, r * TILE);
}

function drawTanks(){
  for (const t of tanks){
    if (t.spawn > 0){
      // 敌人/玩家的出现特效：旋转十字星
      const p = 1 - t.spawn;
      const s = 10 + Math.sin(p * Math.PI * 6) * 6;
      ctx.save();
      ctx.translate(t.x + 16, t.y + 16);
      ctx.rotate(p * Math.PI * 4);
      ctx.fillStyle = (G.blink * 12 | 0) % 2 ? '#ffffff' : '#7fd0ff';
      ctx.fillRect(-s / 2, -2, s, 4);
      ctx.fillRect(-2, -s / 2, 4, s);
      ctx.restore();
      continue;
    }

    ctx.drawImage(tankImg(t), t.x, t.y);

    if (t.carrier && (G.blink * 6 | 0) % 2){
      ctx.strokeStyle = '#ff3b30';
      ctx.lineWidth = 2;
      ctx.strokeRect(t.x + 1, t.y + 1, TANK - 2, TANK - 2);
    }
    if (t.hitFlash > 0){
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillRect(t.x + 2, t.y + 2, TANK - 4, TANK - 4);
    }
    if (t.kind === 'player' && t.shield > 0){
      ctx.save();
      ctx.globalAlpha = t.shield < 3 ? 0.25 + 0.5 * Math.abs(Math.sin(G.blink * 14)) : 0.75;
      ctx.strokeStyle = '#7fe4ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(t.x - 1, t.y - 1, TANK + 2, TANK + 2);
      ctx.globalAlpha *= 0.25;
      ctx.fillStyle = '#7fe4ff';
      ctx.fillRect(t.x - 1, t.y - 1, TANK + 2, TANK + 2);
      ctx.restore();
    }
  }
}

function drawBullets(){
  for (const b of bullets){
    ctx.fillStyle = '#9a9a9a';
    ctx.fillRect(b.x, b.y, BULLET, BULLET);
    ctx.fillStyle = '#f4f4f4';
    ctx.fillRect(b.x + 1, b.y + 1, BULLET - 2, BULLET - 2);
  }
}

function drawPowerups(){
  for (const p of powerups){
    if (p.life < 5 && (G.blink * 8 | 0) % 2) continue;
    ctx.drawImage(POWER_IMG[p.type], p.x, p.y);
  }
}

function drawEffects(){
  for (const e of effects){
    const p = e.t / e.dur;
    const R = (e.big ? 21 : 9) * (0.45 + p * 0.85);
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p * p);
    const rings = [['#d8480c',1], ['#f59a1e',0.72], ['#ffe98a',0.4], ['#ffffff',0.18]];
    for (const [color, k] of rings){
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(e.x, e.y, R * k, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

/* --- 右侧信息面板 --- */
function drawPanel(){
  ctx.fillStyle = '#6b6b6b';
  ctx.fillRect(FIELD, 0, PANEL, H);
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#111';

  // 剩余敌人
  const n = enemiesLeft();
  for (let i = 0; i < n; i++)
    ctx.drawImage(ICON_ENEMY, FIELD + 7 + (i % 5) * 17, 18 + ((i / 5) | 0) * 16);

  // 剩余生命
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.fillText('IP', FIELD + 10, 196);
  for (let i = 0; i < Math.min(G.lives, 5); i++)
    ctx.drawImage(ICON_LIFE, FIELD + 10 + i * 17, 208, 15, 15);
  if (G.lives > 5) ctx.fillText('x' + G.lives, FIELD + 10, 228);

  // 关卡
  ctx.drawImage(ICON_FLAG, FIELD + 10, 262);
  ctx.font = '12px "Press Start 2P", monospace';
  ctx.fillText(String(G.level + 1), FIELD + 34, 266);

  // 分数
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.fillText('SCORE', FIELD + 10, 306);
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.fillText(String(G.score).padStart(5, '0'), FIELD + 10, 320);
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.fillText('HI', FIELD + 10, 350);
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.fillText(String(Math.max(G.hi, G.score)).padStart(5, '0'), FIELD + 10, 364);

  // 增益状态
  ctx.font = '8px "Press Start 2P", monospace';
  if (G.freeze > 0){ ctx.fillStyle = '#0a3a6a'; ctx.fillText('TIME', FIELD + 10, 396); }
  else if (G.shovel > 0){ ctx.fillStyle = '#0a3a6a'; ctx.fillText('WALL', FIELD + 10, 396); }
}

/* --- 文本工具 --- */
function pixelText(text, x, y, size, color, align){
  ctx.font = size + 'px "Press Start 2P", monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.textAlign = 'left';
}
function cjkText(text, x, y, size, color){
  ctx.font = size + 'px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.textAlign = 'left';
}

function drawTitle(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;

  ctx.save();
  ctx.shadowColor = 'rgba(240,208,48,.55)';
  ctx.shadowBlur = 16;
  pixelText('BATTLE CITY', W / 2 - 28, 56, 22, '#f0d030', 'center');
  ctx.restore();
  pixelText(GAME_VERSION, W - 8, 62, 8, '#c9d3e0', 'right');
  cjkText('坦 克 大 战', W / 2, 96, 22, '#c9d3e0');

  // 对阵的双方
  const px = 150 + Math.sin(t * 1.1) * 26;
  const ex = 340 - Math.sin(t * 0.9) * 26;
  ctx.drawImage(TANK_IMG['playerright0'], px, 146);
  ctx.drawImage(TANK_IMG['normalleft0'], ex, 146);
  ctx.fillStyle = '#f0d030';
  ctx.fillRect(px + 32, 160, 10, 4);
  ctx.fillStyle = '#9a9a9a';
  ctx.fillRect(ex - 10, 160, 10, 4);

  ctx.drawImage(IMG[BASE], W / 2 - 16, 194);

  if ((t * 1.6 | 0) % 2 === 0)
    pixelText('PRESS  ENTER', W / 2, 250, 13, '#ffffff', 'center');
  cjkText('按 回 车 键 开 始', W / 2, 274, 15, '#8a94a4');

  const demo = [['normal','普通兵'],['fast','快速兵'],['power','火力兵'],['armor','装甲兵']];
  demo.forEach(([kind, name], i) => {
    const x = 92 + i * 90;
    ctx.drawImage(TANK_IMG[kind + 'up0'], x, 312);
    cjkText(name, x + 16, 348, 13, '#7f8a99');
    pixelText(String(ENEMY_TYPES[kind].score), x + 16, 368, 8, '#5f6a79', 'center');
  });

  cjkText('守住老巢，消灭全部敌方坦克', W / 2, 392, 13, '#5f6a79');
}

function drawOverlayMessage(){
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.74)';
  ctx.fillRect(0, 0, W, H);

  if (G.state === 'over'){
    ctx.save();
    ctx.shadowColor = 'rgba(220,60,40,.6)'; ctx.shadowBlur = 18;
    pixelText('GAME OVER', W / 2, H / 2 - 76, 22, '#e8433a', 'center');
    ctx.restore();
    cjkText(G.baseAlive ? '坦克全部损毁' : '老巢被摧毁', W / 2, H / 2 - 34, 15, '#9aa4b2');
    pixelText('SCORE ' + String(G.score).padStart(5, '0'), W / 2, H / 2 + 8, 13, '#f0d030', 'center');
    pixelText('STAGE ' + (G.level + 1), W / 2, H / 2 + 36, 10, '#7f8a99', 'center');
    if ((performance.now() / 500 | 0) % 2 === 0)
      pixelText('PRESS ENTER', W / 2, H / 2 + 78, 11, '#ffffff', 'center');
  } else if (G.state === 'win'){
    ctx.save();
    ctx.shadowColor = 'rgba(240,208,48,.6)'; ctx.shadowBlur = 18;
    pixelText('ALL CLEAR', W / 2, H / 2 - 76, 22, '#f0d030', 'center');
    ctx.restore();
    cjkText('全部关卡通关，老巢守住了', W / 2, H / 2 - 34, 15, '#9aa4b2');
    pixelText('SCORE ' + String(G.score).padStart(5, '0'), W / 2, H / 2 + 8, 13, '#ffffff', 'center');
    if ((performance.now() / 500 | 0) % 2 === 0)
      pixelText('PRESS ENTER', W / 2, H / 2 + 60, 11, '#8a94a4', 'center');
  } else if (G.state === 'clear'){
    pixelText('STAGE ' + (G.level + 1) + ' CLEAR', W / 2, H / 2 - 30, 16, '#ffffff', 'center');
    cjkText('得分 ' + G.score, W / 2, H / 2 + 8, 15, '#f0d030');
  }
  ctx.restore();
}

function drawCurtain(){
  const c = G.curtain;
  if (!c || c.t <= 0) return;
  const halfW = (W / 2) * c.t;
  const halfH = (H / 2) * c.t;
  ctx.fillStyle = '#6b6b6b';
  ctx.fillRect(0, 0, halfW, H);
  ctx.fillRect(W - halfW, 0, halfW, H);
  ctx.fillRect(0, 0, W, halfH);
  ctx.fillRect(0, H - halfH, W, halfH);
}

function render(){
  screenSurface.classList.toggle('at-title', G.state === 'title');
  screenSurface.classList.toggle('in-game', G.state === 'play');
  mobileSettingsBtn.hidden =
    !mobileLayout.matches ||
    !['title', 'play'].includes(G.state) ||
    !settingsOverlay.hidden;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (G.state === 'title'){
    drawTitle();
  } else {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, FIELD, FIELD); ctx.clip();
    drawField();
    drawPowerups();
    drawTanks();
    drawTrees();
    drawBullets();
    drawEffects();
    ctx.restore();
    drawPanel();
    if (G.state !== 'play') drawOverlayMessage();
  }
  drawCurtain();
}

/* ============================================================
   主循环
   ============================================================ */
let last = 0;
function frame(ts){
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts;
  if (G.state === 'paused') updateEffects(dt);
  else update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
   启动
   ============================================================ */
function snap(){
  try {
    window.claude?.hot?.snapshot?.({
      hi: G.hi, level: G.level, score: G.score, lives: G.lives,
      resume: G.state === 'play' || G.state === 'clear'
    });
  } catch (e) { /* 非 Artifact 环境，忽略 */ }
}

const loadingProgress = document.getElementById('loadingProgress');
const loadingBar = document.getElementById('loadingBar');
const loadingText = document.getElementById('loadingText');
const loadingPercent = document.getElementById('loadingPercent');
const loadingRetry = document.getElementById('loadingRetry');
let bootData = null;
let gameStarted = false;
let loadingStarted = false;

function updateLoading(value, label){
  const percent = Math.max(0, Math.min(100, Math.round(value * 100)));
  loadingBar.style.width = percent + '%';
  loadingPercent.textContent = percent + '%';
  loadingProgress.setAttribute('aria-valuenow', String(percent));
  loadingText.textContent = label;
}

async function boot(data){
  bootData = data || {};
  if (gameStarted || loadingStarted) return;
  loadingStarted = true;
  document.getElementById('loading').hidden = false;
  loadingRetry.hidden = true;
  document.body.classList.add('is-loading');
  updateLoading(0, '正在准备音乐资源…');

  try {
    await music.prepare(updateLoading);
  } catch (error){
    console.warn('[music] preload failed', error);
    loadingText.textContent = '音乐加载失败，请检查网络后重试。';
    loadingRetry.hidden = false;
    loadingStarted = false;
    return;
  }

  loadingText.textContent = '加载完成';
  document.getElementById('loading').hidden = true;
  document.body.classList.remove('is-loading');
  if (data && typeof data.hi === 'number') G.hi = data.hi;
  if (data && data.resume && typeof data.level === 'number'){
    G.level = Math.min(data.level, LEVELS.length - 1);
    G.score = data.score || 0;
    G.lives = Math.max(1, data.lives || 3);
    G.curtain = { t:1, phase:'open', cb:null };
    startLevel();
    music.play('battle', true);
  } else {
    music.init();
  }
  requestAnimationFrame(frame);
  gameStarted = true;
  loadingStarted = false;
}

loadingRetry.addEventListener('click', () => boot(bootData));

if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data ?? {});

})();
</script>
